<rect x="60" y="520" width="1090" height="90" rx="16" fill="none" stroke="#9a612f" stroke-width="2" stroke-dasharray="8 8"/><text x="90" y="573" class="small">Rule: AI proposes actions. Safety layers approve or reject. MCU owns power.</text>
