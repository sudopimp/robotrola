<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>text{font-family:Inter,Arial,sans-serif;fill:#2b1b10}.box{fill:#fff7ea;stroke:#9a612f;stroke-width:2}.line{stroke:#9a612f;stroke-width:2;marker-end:url(#arrow)}.title{font-size:34px;font-weight:700}.small{font-size:18px}</style>
