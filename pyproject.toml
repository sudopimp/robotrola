
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotrola-core"
version = "0.1.0"
description = "Robotrola SOTA 2026 humanoid R&D core: hardware, safety, ROS, and fabrication tooling"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND CERN-OHL-S-2.0"
authors = [{name="sudopimp"}]
dependencies = ["pyyaml>=6", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
cad = ["trimesh>=4", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["robotrola*"]
exclude = ["cad*", "assets*", "configs*", "ros2_ws*", "lerobot*", "hardware*", "firmware*", "simulation*", "docs*", "tests*"]
