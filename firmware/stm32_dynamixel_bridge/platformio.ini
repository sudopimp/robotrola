; Robotrola R-01 motor bridge — PlatformIO environments
; Default builds HOST_SIM protocol firmware (no DXL hardware required).
; Enable DXL_HARDWARE=1 and link Dynamixel2Arduino for bench hardware.

[env:stm32_bridge]
platform = ststm32
board = nucleo_f401re
framework = arduino
build_flags =
  -D DXL_HARDWARE=0
  -D PIN_SAFETY_OK=7
  -D PIN_STATUS_LED=13
monitor_speed = 115200

[env:stm32_bridge_dxl]
platform = ststm32
board = nucleo_f401re
framework = arduino
lib_deps =
  robotis-git/Dynamixel2Arduino @ ^0.6.2
build_flags =
  -D DXL_HARDWARE=1
  -D PIN_SAFETY_OK=7
  -D PIN_STATUS_LED=13
monitor_speed = 115200
