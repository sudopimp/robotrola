name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/validate_repo.py
      - run: python scripts/bom_summary.py
      - run: python scripts/bom_cost_model.py
      - run: python scripts/run_safety_path.py
      - run: python scripts/demo_investor.py
      - run: python scripts/sim_smoke.py
      - run: python scripts/check_firmware.py
      - run: python scripts/host_serial_demo.py
      - run: python scripts/sim_mujoco_smoke.py
      - run: python scripts/record_lerobot_episode.py -o /tmp/robotrola_lerobot_ci
