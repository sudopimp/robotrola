name: ros-optional
# colcon build on ROS 2 Jazzy container — optional depth beyond pure-Python CI.
on:
  workflow_dispatch:
  push:
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros-optional.yml"
  pull_request:
    paths:
      - "ros2_ws/**"
jobs:
  colcon:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pip
          pip3 install --break-system-packages pyyaml numpy || pip3 install pyyaml numpy
          pip3 install --break-system-packages -e ".[dev]" || true
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y || true
          colcon build --symlink-install
      - name: List packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          ros2 pkg list | grep robotrola || true
