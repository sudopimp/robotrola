name: ros-optional
# colcon build on ROS 2 Jazzy — messages + ament packages.
on:
  workflow_dispatch:
  push:
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros-optional.yml"
  pull_request:
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros-optional.yml"

jobs:
  colcon:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep python3-pip \
            ros-jazzy-rosidl-default-generators ros-jazzy-rosidl-default-runtime \
            python3-yaml python3-numpy
          pip3 install --break-system-packages pyyaml numpy || true
      - name: colcon build
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y || true
          colcon build --symlink-install --event-handlers console_direct+
      - name: List robotrola packages
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          ros2 pkg list | grep robotrola
